<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamalú Beer</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <!-- Vista de login -->
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-card">
      <h1>Chamalú Beer</h1>
      <p class="subtitle">Sistema de inventario y ventas</p>
      <label for="login-usuario">Usuario o correo</label>
      <input type="text" id="login-usuario" required autocomplete="username">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <div id="login-error" class="error-msg"></div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
  </div>

  <!-- Modal de apertura de caja (decisión 8D) -->
  <div id="modal-caja" class="modal-overlay hidden">
    <div class="modal">
      <h2>Apertura de caja</h2>
      <p>Indica con cuánto dinero abres hoy.</p>
      <label for="apertura-mayor">Caja mayor (ventas)</label>
      <input type="number" id="apertura-mayor" min="0" step="1000" value="0">
      <label for="apertura-menor">Caja menor (cambios)</label>
      <input type="number" id="apertura-menor" min="0" step="1000" value="0">
      <div id="caja-error" class="error-msg"></div>
      <button id="btn-apertura" class="btn btn-primary btn-block">Abrir caja</button>
    </div>
  </div>

  <!-- Modal de cambio de contraseña obligatorio (Fase 8) -->
  <div id="modal-password" class="modal-overlay hidden">
    <div class="modal">
      <h2>Cambia tu contraseña</h2>
      <p>Por seguridad debes reemplazar la contraseña inicial antes de continuar.</p>
      <label for="pass-actual">Contraseña actual</label>
      <input type="password" id="pass-actual" autocomplete="current-password">
      <label for="pass-nueva">Nueva contraseña</label>
      <input type="password" id="pass-nueva" autocomplete="new-password">
      <div id="pass-error" class="error-msg"></div>
      <button id="btn-cambiar-pass" class="btn btn-primary btn-block">Cambiar contraseña</button>
    </div>
  </div>

  <!-- Estructura principal -->
  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-menu" class="icon-btn btn-menu" title="Ocultar/mostrar menú" aria-label="Ocultar o mostrar menú">☰</button>
        <div class="brand">
          <img id="topbar-logo" src="/img/logo-default.svg" alt="logo" class="logo">
          <span id="topbar-nombre" class="brand-name">Chamalú Beer</span>
        </div>
      </div>
      <div class="topbar-right">
        <span id="topbar-user" class="user-pill"></span>
        <button id="btn-logout" class="btn btn-ghost">Cerrar sesión</button>
      </div>
    </header>
    <div class="body">
      <div id="menu-hover" class="menu-hover" aria-hidden="true"></div>
      <nav id="sidebar" class="sidebar"></nav>
      <main id="content" class="content">
        <p class="placeholder">Selecciona un módulo del menú.</p>
      </main>
    </div>
    <!-- Barra de mesas movida a Facturación (Fase 3 - Fase C) -->
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
